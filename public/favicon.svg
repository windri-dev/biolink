<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="biolinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- BioLink Modern Interlinked Node & Ring Symbol -->
  <g filter="url(#glow)">
    <!-- Node Left Loop -->
    <path d="M46 38 C32 38, 22 48, 22 64 C22 80, 32 90, 46 90 L56 90 C62 90, 66 86, 66 80 C66 74, 62 70, 56 70 L46 70 C38 70, 34 66, 34 64 C34 62, 38 58, 46 58 L56 58 C62 58, 66 54, 66 48 C66 42, 62 38, 56 38 Z" fill="url(#biolinkGrad)" />
    
    <!-- Node Right Loop -->
    <path d="M82 90 C96 90, 106 80, 106 64 C106 48, 96 38, 82 38 L72 38 C66 38, 62 42, 62 48 C62 54, 66 58, 72 58 L82 58 C90 58, 94 62, 94 64 C94 66, 90 70, 82 70 L72 70 C66 70, 62 74, 62 80 C62 86, 66 90, 72 90 Z" fill="url(#biolinkGrad)" />

    <!-- Center AI Spark Connector Dot -->
    <circle cx="64" cy="64" r="7" fill="#38bdf8" />
  </g>
</svg>
